<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#111827"/><text x="50" y="45" fill="#f9fafb" font-family="sans-serif" font-size="24">Controls fail only after removing what the proof needs</text>
<g font-family="sans-serif" font-size="16"><text x="50" y="95" fill="#cbd5e1">C1  remove O⊆F</text><text x="420" y="95" fill="#fb7185">g(H)=1, g(U)=0</text>
<text x="50" y="135" fill="#cbd5e1">C2  remove Regular Facts</text><text x="420" y="135" fill="#fb7185">0 &lt; 99/100</text>
<text x="50" y="175" fill="#cbd5e1">C3  remove calibration</text><text x="420" y="175" fill="#fb7185">p(U)=1/2, g(U)=0</text>
<text x="50" y="215" fill="#cbd5e1">C4  remove Regular Facts</text><text x="420" y="215" fill="#fb7185">0 &lt; required 9/10</text>
<text x="50" y="255" fill="#cbd5e1">C5  strengthen K+1 → K</text><text x="420" y="255" fill="#fb7185">1/4 &lt; 1/3</text>
<text x="50" y="295" fill="#cbd5e1">C6  remove sparsity</text><text x="420" y="295" fill="#fb7185">1/5 &lt; 1/4</text></g>
<text x="50" y="335" fill="#34d399" font-family="sans-serif" font-size="15">All intended failures observed; no control passes vacuously.</text></svg>
